spring:
  application:
    name: library-management

  datasource:
    url: jdbc:oracle:thin:@host.docker.internal:1521/orclpdb
    username: library_userxxxxxxx
    password: library_userxxxxxx
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
